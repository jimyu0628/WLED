; =============================================================================
;  WLED 16 自定义编译环境：ESP32-C3 + BfMsp usermod
;  放置位置：WLED 仓库根目录（与 platformio.ini 同级）
;  编译命令：pio run -e esp32c3dev_bfmsp
; =============================================================================
[env:esp32c3dev_bfmsp]
extends = env:esp32c3dev
custom_usermods = bfmsp
build_flags =
  ${env:esp32c3dev.build_flags}
  -D BF_MSP_RX_PIN=5
  -D BF_MSP_TX_PIN=4
  -D BF_MSP_BAUD=115200
  ; 需要解析油门（通道3）做联动时，取消下一行注释：
  ; -D BF_MSP_USE_THROTTLE
